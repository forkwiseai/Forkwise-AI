name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend/app
      - name: Start and check health
        working-directory: backend
        env:
          SANDBOX: local
          DATA_DIR: /tmp/forkwise-data
          LLM_BASE_URL: http://127.0.0.1:9/v1
          LLM_API_KEY: ci
          LLM_MODELS: ci-model
        run: |
          python -m uvicorn app.main:app --port 5000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/api/health && exit 0; sleep 1; done
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
